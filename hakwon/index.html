<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>하원 정산</title>
<meta name="description" content="자녀 학원 하원 체크와 월간·연간 하원비 정산 (V 1.2.0 by S.H.KIM)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하원정산">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#FFF4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1D1418" media="(prefers-color-scheme: dark)">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<script>window.HAKWON_WEB = true;</script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 엄마의 하원 노트 — 단일 열 카드(최대 560px). 위에서 아래로 "누가 → 어디 → 체크 → 자녀별 비용". 하단 탭 4개. */
:root{
  --paper:#FFF4F7; --card:#FFFFFF; --ink:#3A2430; --ink-2:#6E5562; --ink-3:#9A8290;
  --line:#F5DCE6; --field:#FFF9FB;
  --rose:#C23A6E; --on-rose:#FFFFFF; --rose-soft:#FCE3EC; --rose-mid:#F3B6CB;
  --sky:#2B74AE; --sky-soft:#E3F0FA;
  --ok:#1F7A55; --ok-soft:#E0F3EA; --warn:#9A5B00; --warn-soft:#FFF0D9; --danger:#B4232F;
  --k0:#D9577F; --k0s:#FDE6EE; --k1:#3E86C4; --k1s:#E4F0FB; --k2:#8A63C8; --k2s:#EFE8FA; --k3:#2F9A7E; --k3s:#E2F4EE; --k4:#C9822A; --k4s:#FBF0E0;
  --shadow:0 2px 6px rgba(160,60,100,.06),0 10px 24px rgba(160,60,100,.07);
  --f-display:"Jua","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:20px; --nav-h:66px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1D1418; --card:#2A1E24; --ink:#F7E9EF; --ink-2:#CDB4C0; --ink-3:#9E8592;
  --line:#40303A; --field:#23191E;
  --rose:#F28DB3; --on-rose:#2A0F1B; --rose-soft:#43222F; --rose-mid:#6A3349;
  --sky:#8FC3EE; --sky-soft:#1E2E3D;
  --ok:#5FCB9C; --ok-soft:#173327; --warn:#F2B866; --warn-soft:#3A2A12; --danger:#FF8A93;
  --k0:#F08DAA; --k0s:#45222F; --k1:#8CBDEB; --k1s:#1E2E3E; --k2:#BCA0EE; --k2s:#2E2442; --k3:#6FD0B2; --k3s:#163329; --k4:#EDB46A; --k4s:#3A2A14;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1D1418; --card:#2A1E24; --ink:#F7E9EF; --ink-2:#CDB4C0; --ink-3:#9E8592;
  --line:#40303A; --field:#23191E;
  --rose:#F28DB3; --on-rose:#2A0F1B; --rose-soft:#43222F; --rose-mid:#6A3349;
  --sky:#8FC3EE; --sky-soft:#1E2E3D;
  --ok:#5FCB9C; --ok-soft:#173327; --warn:#F2B866; --warn-soft:#3A2A12; --danger:#FF8A93;
  --k0:#F08DAA; --k0s:#45222F; --k1:#8CBDEB; --k1s:#1E2E3E; --k2:#BCA0EE; --k2s:#2E2442; --k3:#6FD0B2; --k3s:#163329; --k4:#EDB46A; --k4s:#3A2A14;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent;word-break:keep-all}
/* 아이폰: 연속 탭 시 화면 확대 방지, 입력 시 하단 메뉴 숨김 */
button,a,input,label,textarea{touch-action:manipulation}
body.kb .tabs{display:none}
body.kb main{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
input[type=date]{display:block;line-height:44px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.guide{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:15px;color:var(--ink-2)}
.guide b{color:var(--ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rose-mid);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.ver{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);white-space:nowrap}
.brand{font-family:var(--f-display);font-size:19px;line-height:1;white-space:nowrap;color:var(--rose)}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.mute{background:var(--rose-soft);color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

main{padding-block:6px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.25;margin:0}
.hint{font-size:13px;color:var(--ink-3);font-weight:500}
.muted{color:var(--ink-2)} .small{font-size:14px}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;min-width:0}
.card-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* buttons */
.btn{min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .18s,border-color .18s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--rose);color:var(--on-rose);border-color:var(--rose)}
.btn.soft{background:var(--rose-soft);border-color:transparent;color:var(--rose)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--rose)}
.btn.sm{min-height:38px;padding:0 13px;font-size:14px;border-radius:12px}
.btn.big{min-height:60px;font-size:18px;border-radius:18px;width:100%;font-family:var(--f-display);font-weight:400;letter-spacing:.01em}
.btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}
.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;color:var(--ink-2)}
.icon-btn[disabled]{opacity:.35}
.icon-btn svg,.btn svg{width:20px;height:20px}
input[type=text],input[type=number],input[type=date],textarea{-webkit-appearance:none;appearance:none;min-height:46px;border:1px solid var(--line);border-radius:14px;background:var(--field);padding:0 14px;width:100%;font-size:16px;color:var(--ink)}
textarea{padding:10px 14px;min-height:70px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.field>span{font-size:14px;font-weight:700;color:var(--ink-2)}

/* date */
.datebar{display:flex;align-items:center;gap:8px}
.datebar .d{flex:1;text-align:center;min-width:0}
.datebar .d strong{font-family:var(--f-display);font-weight:400;font-size:26px;display:block;line-height:1.15}
.datebar .d small{color:var(--ink-2);font-size:14px}

/* step label */
.step{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--rose-soft);color:var(--rose);font-weight:700;font-size:14px;flex:none}

/* kid chips */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.kid{position:relative;display:flex;align-items:center;gap:10px;min-height:62px;padding:8px 12px 8px 8px;border-radius:18px;border:2px solid var(--line);background:var(--field);text-align:left;transition:border-color .18s,background .18s;min-width:0}
.ava{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;flex:none;background:var(--ks);color:var(--kc)}
.kid .nm{font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere}
.kid[aria-pressed="true"]{border-color:var(--kc);background:var(--ks)}
.kid[aria-pressed="true"] .ava{background:var(--kc);color:var(--card)}
.tick{position:absolute;right:8px;top:8px;width:20px;height:20px;border-radius:50%;background:var(--kc);color:var(--card);display:none;place-items:center}
.tick svg{width:13px;height:13px}
.kid[aria-pressed="true"] .tick,.ac[aria-pressed="true"] .tick{display:grid}

/* academy chips */
.acs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ac{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:64px;padding:10px 14px;border-radius:16px;border:2px solid var(--line);background:var(--field);text-align:left;transition:border-color .18s,background .18s;min-width:0}
.ac .nm{font-weight:700;font-size:16px;padding-right:22px;overflow-wrap:anywhere}
.ac .pr{font-size:13px;color:var(--ink-2)}
.ac .pr.zero{color:var(--warn);font-weight:700}
.ac[aria-pressed="true"]{border-color:var(--rose);background:var(--rose-soft);--kc:var(--rose)}
.quick{display:flex;gap:6px}

/* check button area */
.go{display:flex;flex-direction:column;gap:8px}
.go .preview{font-size:14px;color:var(--ink-2);text-align:center;min-height:22px}

/* today records */
.rec-kid{display:flex;flex-direction:column;gap:6px;padding-block:6px}
.rec-kid+.rec-kid{border-top:1px dashed var(--line);padding-top:12px}
.rec-head{display:flex;align-items:center;gap:8px}
.ava.sm{width:30px;height:30px;font-size:15px}
.rec-line{display:flex;align-items:center;gap:8px;padding-left:38px;font-size:15px}
.rec-line .amt{margin-left:auto;font-weight:700}
.minus{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px;font-weight:700;color:var(--ink-2);flex:none}
.sum-line{display:flex;align-items:baseline;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.sum-line b{font-family:var(--f-display);font-weight:400;font-size:22px}

/* per-child cost */
.kc-list{display:flex;flex-direction:column;gap:12px}
.kc{display:flex;flex-direction:column;gap:6px}
.kc-top{display:flex;align-items:center;gap:10px}
.kc-top .nm{font-weight:700;font-size:16px}
.kc-top .amt{margin-left:auto;font-family:var(--f-display);font-size:20px}
.bar{height:10px;border-radius:999px;background:var(--field);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--kc)}
.kc-acs{display:flex;flex-wrap:wrap;gap:6px;padding-left:54px}
.pill{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--ks);color:var(--ink-2);white-space:nowrap}
.grand{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;padding:14px 16px;border-radius:16px;background:var(--rose-soft)}
.grand .lb{font-weight:700;color:var(--rose)}
.grand b{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1;margin-left:auto}

.banner{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:600;flex-wrap:wrap}
.banner b{flex:1;min-width:170px;font-weight:700}
.banner.info{background:var(--sky-soft);color:var(--sky)}
.locked-note{display:flex;gap:8px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--ok-soft);color:var(--ok);font-size:14px;font-weight:700}
.locked-note svg{width:18px;height:18px;flex:none}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font-size:12px;text-align:center;color:var(--ink-3);font-weight:700;padding-block:4px}
.cal .wd.sun{color:var(--rose)}
.cell{aspect-ratio:1/1.15;max-width:100%;border-radius:12px;border:1.5px solid transparent;background:var(--field);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:3px;font-size:14px;min-width:0}
.cell.blank{background:transparent}
.cell.today{border-color:var(--rose)}
.cell.has{background:var(--rose-soft)}
.cell .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:90%}
.cell .dots i{width:6px;height:6px;border-radius:50%;background:var(--kc)}
.cell .memo-dot{width:5px;height:5px;border-radius:2px;background:var(--sky)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--kc)}

/* settle */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--rose-soft);border-radius:16px;padding:4px;gap:4px}
.seg button{min-height:42px;border:0;border-radius:12px;background:transparent;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--rose);box-shadow:var(--shadow)}
.total-big{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.total-big b{font-family:var(--f-display);font-weight:400;font-size:42px;line-height:1}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.badge.lock{background:var(--ok-soft);color:var(--ok)} .badge.open{background:var(--rose-soft);color:var(--rose)}
.badge svg{width:13px;height:13px}
.kcard{border-radius:18px;border:1px solid var(--line);background:var(--field);padding:14px;display:flex;flex-direction:column;gap:8px}
.kcard-head{display:flex;align-items:center;gap:10px}
.kcard-head .nm{font-family:var(--f-display);font-size:20px}
.kcard-head .amt{margin-left:auto;text-align:right;line-height:1.2}
.kcard-head .amt b{font-family:var(--f-display);font-weight:400;font-size:22px;display:block}
.kcard-head .amt small{font-size:12px;color:var(--ink-3)}
.lines{display:flex;flex-direction:column}
.ln{display:flex;align-items:baseline;gap:8px;padding:8px 2px;border-top:1px solid var(--line);font-size:15px}
.ln .calc{color:var(--ink-3);font-size:13px}
.ln .amt{margin-left:auto;font-weight:700}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--ink-3);font-weight:700;text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.sub td{font-weight:700;background:var(--rose-soft)}
.chart svg{width:100%;height:auto;display:block}

/* settings */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .nm{flex:1;min-width:90px;font-weight:700;overflow-wrap:anywhere}
.no{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);min-width:20px}
.price-in{display:flex;align-items:center;gap:6px;width:100%;padding-left:28px}
.price-in input{max-width:150px;text-align:right}
.price-in .unit{color:var(--ink-2);font-size:14px}
.price-in .hist{font-size:12px;color:var(--ink-3);flex-basis:100%}
.diag ul{list-style:none;margin:0;padding:0}
.diag li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.diag .st{font-weight:700;min-width:36px}
.diag .st.ok{color:var(--ok)} .diag .st.warn{color:var(--warn)} .diag .st.bad{color:var(--danger)}
.diag code{font-family:var(--f-mono);font-size:12px;word-break:break-all;color:var(--ink-2)}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--ink-3)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--rose)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(40,16,28,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:22px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.pin-dots{display:flex;gap:14px;justify-content:center;padding:6px 0}
.pin-dots span{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink-3)}
.pin-dots span.f{background:var(--rose);border-color:var(--rose)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{min-height:56px;border-radius:16px;border:1px solid var(--line);background:var(--field);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.pin-msg{text-align:center;min-height:22px;font-size:14px;color:var(--danger)}
.code-box{font-family:var(--f-mono);font-size:24px;letter-spacing:.12em;text-align:center;padding:14px;border-radius:14px;background:var(--field);border:1px dashed var(--rose-mid);user-select:all}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper);padding:10px 12px 10px 16px;border-radius:14px;display:flex;align-items:center;gap:10px;font-size:14px;width:max-content;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast button{border:0;background:transparent;color:var(--rose-mid);font-weight:700;min-height:36px;padding:0 8px;text-decoration:underline;white-space:nowrap}
.pop{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="top"><div class="wrap">

<script>
/* ===== core: 순수 계산 함수 (DOM 없음) ===== */
const Core = (() => {
  const pad2 = n => String(n).padStart(2, '0');
  const ymOf = date => date.slice(0, 7);                 // "2026-10-28" -> "2026-10"
  const monthDocId = ym => 'm' + ym;                       // "m2026-10"
  const daysInMonth = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
  const todayStr = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const key = (childId, acadId) => childId + '|' + acadId;

  // 적용 단가: 해당 날짜 이전(포함) 가장 최근 단가. 그보다 이른 날짜는 첫 단가.
  function rateFor(acad, date) {
    const rates = (acad && acad.rates ? acad.rates.slice() : []).sort((a, b) => a.from < b.from ? -1 : a.from > b.from ? 1 : 0);
    if (!rates.length) return 0;
    let r = rates[0].price;
    for (const x of rates) { if (x.from <= date) r = x.price; else break; }
    return Number(r) || 0;
  }

  // 월 집계: rows = [{childId, acadId, count, amount, rates:Set}]
  function monthSummary(cfg, monthDoc) {
    const acadById = Object.fromEntries((cfg.academies || []).map(a => [a.id, a]));
    const map = new Map();
    const visits = (monthDoc && monthDoc.v) || {};
    for (const date of Object.keys(visits)) {
      const day = visits[date] || {};
      for (const k of Object.keys(day)) {
        const n = Math.max(0, Math.floor(Number(day[k]) || 0));
        if (!n) continue;
        const [childId, acadId] = k.split('|');
        const price = rateFor(acadById[acadId], date);
        if (!map.has(k)) map.set(k, { childId, acadId, count: 0, amount: 0, rates: new Set() });
        const r = map.get(k);
        r.count += n; r.amount += n * price; r.rates.add(price);
      }
    }
    const rows = [...map.values()];
    const total = rows.reduce((s, r) => s + r.amount, 0);
    const totalCount = rows.reduce((s, r) => s + r.count, 0);
    return { rows, total, totalCount };
  }

  function yearTotals(cfg, monthDocs, year) {
    const out = [];
    for (let m = 1; m <= 12; m++) {
      const ym = `${year}-${pad2(m)}`;
      const s = monthSummary(cfg, monthDocs[ym]);
      out.push({ ym, month: m, total: s.total, count: s.totalCount });
    }
    return { months: out, total: out.reduce((s, x) => s + x.total, 0), count: out.reduce((s, x) => s + x.count, 0) };
  }

  const csvCell = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  // 수식 주입 방지: = + - @ 로 시작하는 텍스트 앞에 ' 추가
  const safeText = v => { const s = String(v ?? ''); return /^[=+\-@\t\r]/.test(s) ? "'" + s : s; };

  function monthCsv(cfg, monthDoc, ym) {
    const childName = id => safeText((cfg.children || []).find(c => c.id === id)?.name || '(삭제됨)');
    const acad = id => (cfg.academies || []).find(a => a.id === id);
    const lines = [['날짜', '자녀', '학원', '횟수', '단가(원)', '금액(원)', '메모'].join(',')];
    const visits = (monthDoc && monthDoc.v) || {};
    const memos = (monthDoc && monthDoc.memo) || {};
    let total = 0;
    for (const date of Object.keys(visits).sort()) {
      for (const k of Object.keys(visits[date]).sort()) {
        const n = Math.floor(Number(visits[date][k]) || 0); if (!n) continue;
        const [c, a] = k.split('|'); const ac = acad(a); const p = rateFor(ac, date);
        total += n * p;
        lines.push([date, childName(c), safeText(ac?.name || '(삭제됨)'), n, p, n * p, safeText(memos[date] || '')].map(csvCell).join(','));
      }
    }
    lines.push(['합계', '', '', '', '', total, ''].map(csvCell).join(','));
    return '﻿' + lines.join('\r\n');
  }

  // 자녀별 집계: { childId: { total, count, acads: { acadId: {count, amount} }, months: [12개 금액] } }
  function byChild(cfg, monthDocs, yms) {
    const out = {};
    yms.forEach((ym, mi) => {
      const s = monthSummary(cfg, monthDocs[ym]);
      for (const r of s.rows) {
        const c = out[r.childId] || (out[r.childId] = { total: 0, count: 0, acads: {}, months: yms.map(() => 0) });
        c.total += r.amount; c.count += r.count; c.months[mi] += r.amount;
        const a = c.acads[r.acadId] || (c.acads[r.acadId] = { count: 0, amount: 0 });
        a.count += r.count; a.amount += r.amount;
      }
    });
    return out;
  }
  const yearYms = year => Array.from({ length: 12 }, (_, i) => `${year}-${pad2(i + 1)}`);

  function yearCsv(cfg, monthDocs, year) {
    const yms = yearYms(year);
    const bc = byChild(cfg, monthDocs, yms);
    const kids = (cfg.children || []).filter(c => bc[c.id]);
    const y = yearTotals(cfg, monthDocs, year);
    const lines = [['월', ...kids.map(k => csvCell(safeText(k.name) + '(원)')), '횟수', '합계(원)'].join(',')];
    y.months.forEach((m, i) => lines.push([m.ym, ...kids.map(k => bc[k.id].months[i]), m.count, m.total].join(',')));
    lines.push(['연간 합계', ...kids.map(k => bc[k.id].total), y.count, y.total].join(','));
    return '﻿' + lines.join('\r\n');
  }

  const won = n => (Math.round(n) || 0).toLocaleString('ko-KR');

  return { pad2, ymOf, monthDocId, daysInMonth, todayStr, key, rateFor, monthSummary, yearTotals, byChild, yearYms, monthCsv, yearCsv, won, safeText };
})();


</script>

/* ---------- 파일 (백업/CSV) ---------- */
function nextFileName(topic, ext) {
  const d = today.replace(/-/g, '');
  const fs = S.cfg.fileSeq && S.cfg.fileSeq.date === d ? S.cfg.fileSeq : { date: d, n: 0 };
  fs.n += 1; S.cfg.fileSeq = fs; markDirty('config');
  return `${d}_${C.pad2(fs.n)}_${topic}.${ext}`;
}
// 독립 실행판: 아이폰 공유 창(파일에 저장) → 안 되면 내려받기
async function webSave(filename, data, mime) {
  const blob = new Blob([data], { type: mime });
  try {
    const file = new File([blob], filename, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename });
      return 'ok';
    }
  } catch (e) { if (e && e.name === 'AbortError') return 'cancel'; /* 공유 불가 → 내려받기로 */ }
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = filename; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return 'ok';
}
async function saveFile(topic, ext, data) {
  if (WEB) {
    const filename = nextFileName(topic, ext);
    try {
      const r = await webSave(filename, data, ext === 'csv' ? 'text/csv' : 'application/json');
      if (r === 'cancel') { toast('파일 저장을 취소했습니다.'); return false; }
      toast(`${filename} 저장했습니다.`); return true;
    } catch (e) {
      S.lastError = { code: e && e.name || 'unknown', message: e && e.message || String(e), where: '파일 저장', at: new Date().toISOString() };
      toast(`파일을 저장하지 못했습니다 (${S.lastError.code})`); return false;
    }
  }
  if (!S.downloads) { toast('이 화면에서는 파일 저장을 쓸 수 없습니다. 설정 > 자가 진단에서 원인을 확인하세요.'); return false; }
  const filename = nextFileName(topic, ext);
  try { await S.downloads.save({ filename, data }); toast(`${filename} 저장했습니다.`); return true; }
  catch (e) {
    if (e && e.code === 'declined') { toast('파일 저장을 취소했습니다.'); return false; }
    S.lastError = { code: e && e.code || 'unknown', message: e && e.message || String(e), where: '파일 저장', at: new Date().toISOString() };
    toast(S.isOwner ? `파일을 저장하지 못했습니다 (${S.lastError.code})` : '파일을 저장하지 못했습니다.'); return false;
  }
}

/* ---------- 기록 동작 ---------- */
function addVisits(date, pairs, delta) {
  const ym = C.ymOf(date);
  if (isLocked(ym)) { toast(`${+ym.slice(5)}월은 정산 완료로 잠겨 있습니다.`); return false; }
  const md = monthDoc(ym); md.v = md.v || {}; md.v[date] = md.v[date] || {};
  for (const [c, a] of pairs) {
    const k = C.key(c, a); const n = Math.max(0, (md.v[date][k] || 0) + delta);
    if (n) md.v[date][k] = n; else delete md.v[date][k];
  }
  if (!Object.keys(md.v[date]).length) delete md.v[date];
  markDirty('m' + ym); return true;
}
function doCheck() {
  const date = S.selDate;
  const kids = activeKids().filter(k => S.selKids.has(k.id)), acads = activeAcads().filter(a => S.selAcads.has(a.id));
  if (!kids.length || !acads.length) return;
  const pairs = []; kids.forEach(k => acads.forEach(a => pairs.push([k.id, a.id])));
  if (!addVisits(date, pairs, +1)) return;
  const amt = pairs.reduce((s, [, a]) => s + C.rateFor(acadOf(a), date), 0);
  const zero = acads.filter(a => !C.rateFor(a, date)).map(a => a.name);
  S.selAcads.clear(); S.pop = true; render();
  toast(zero.length ? `${pairs.length}건 기록 · 단가 미설정: ${zero.join(', ')}` : `${pairs.length}건 기록했어요 · ${C.won(amt)}원`, { label: '되돌리기', fn: () => { addVisits(date, pairs, -1); render(); toast('방금 기록을 취소했습니다.'); } });
}

/* ---------- 렌더: 달력 ---------- */
function shiftYm(ym, n) { let [y, m] = ym.split('-').map(Number); m += n; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${C.pad2(m)}`; }

}

function settleMonthHtml() {

  const cards = kids.map(k => {

    const tot = rows.reduce((t, r) => t + r.amount, 0), cnt = rows.reduce((t, r) => t + r.count, 0);
    return `<div class="kcard" style="${kidVars(k.id)}"><div class="kcard-head">${ava(k.id)}<span class="nm">${esc(k.name)}</span><span class="amt"><b class="num">${C.won(tot)}원</b><small class="num">${cnt}회</small></span></div>

    <div class="total-big"><b class="num">${C.won(s.total)}</b><span>원</span><span class="spacer"></span><span class="muted num">${s.totalCount}회</span></div>

function settleYearHtml() {
  const year = S.setYear, yms = C.yearYms(year), y = C.yearTotals(S.cfg, S.months, year), bc = C.byChild(S.cfg, S.months, yms);
  const kids = kidsForReport(new Set(Object.keys(bc)));
  const W = 340, H = 210, padL = 8, padB = 26, padT = 24, bw = (W - padL * 2) / 12, max = Math.max(...y.months.map(x => x.total), 1);
  const scale = v => v / max * (H - padB - padT);
  const bars = y.months.map((x, i) => {
    const bx = padL + i * bw + 4, w = bw - 8; let top = H - padB; let segs = '';
    kids.forEach(k => { const v = bc[k.id] ? bc[k.id].months[i] : 0; if (!v) return; const h = Math.max(scale(v), 2); top -= h; segs += `<rect x="${bx}" y="${top}" width="${w}" height="${h}" fill="var(--kc)" style="${kidVars(k.id)}"></rect>`; });
    const lbl = x.total ? (x.total >= 10000 ? `${(x.total / 10000).toFixed(1).replace(/\.0$/, '')}만` : C.won(x.total)) : '';

  }).join('');
  const kidCards = kids.map(k => {

    return `<div class="kcard" style="${kidVars(k.id)}"><div class="kcard-head">${ava(k.id)}<span class="nm">${esc(k.name)}</span><span class="amt"><b class="num">${C.won(c.total)}원</b><small class="num">${c.count}회</small></span></div>
      ${ac.length ? `<div class="lines">${ac.map(([id, v]) => `<div class="ln"><span>${esc(acadName(id))}</span><span class="calc num">${v.count}회</span><span class="amt num">${C.won(v.amount)}원</span></div>`).join('')}</div>` : '<span class="hint">올해 기록 없음</span>'}</div>`;

  return `<div class="datebar"><button class="icon-btn" type="button" id="y-prev" aria-label="이전 해">${ICON.left}</button><div class="d"><strong>${year}년</strong><small>연간 누계</small></div><button class="icon-btn" type="button" id="y-next" aria-label="다음 해">${ICON.right}</button></div>

    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${year}년 월별 자녀별 하원비 막대그래프"><line x1="${padL}" x2="${W - padL}" y1="${H - padB}" y2="${H - padB}" stroke="var(--line)"></line>${bars}</svg></div>
    <div class="legend">${kids.map(k => `<span style="${kidVars(k.id)}"><i></i>${esc(k.name)} ${C.won(bc[k.id]?.total || 0)}원</span>`).join('')}</div></div>

    </ol>

  <div class="card diag"><div class="row"><h3>자가 진단</h3><span class="spacer"></span><button class="btn sm" type="button" id="diag-run">점검하기</button></div><div id="diag-out" class="hint">저장소, 파일 저장, 암호화, 백업 상태를 점검합니다.</div></div>
  <p class="hint" style="text-align:center;margin:0">하원 정산 V ${APP_VERSION} by S.H.KIM · 저장 위치: ${S.mode === 'db' ? '내 claude.ai 계정' : WEB ? '이 기기' : '이 브라우저(임시)'}</p>`;
  bindSettings(el);
}
function move(list, id, dir) {
  const arr = list.filter(x => !x.archived).sort(byOrder); const i = arr.findIndex(x => x.id === id), j = i + dir;
  if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; arr.forEach((x, n) => x.order = n + 1);
}
function editSheet(title, label, value, onSave) {
  openSheet(`<h3>${esc(title)}</h3><label class="field"><span>${esc(label)}</span><input type="text" id="ed-in" value="${esc(value)}" maxlength="30"></label>
    <div class="row"><button class="btn" type="button" id="ed-no">취소</button><span class="spacer"></span><button class="btn primary" type="button" id="ed-ok">저장</button></div>`, el => {
    $('#ed-no', el).onclick = closeSheet;
    const ok = () => { const v = $('#ed-in', el).value.trim(); if (!v) return; closeSheet(); onSave(v); };
    $('#ed-ok', el).onclick = ok; $('#ed-in', el).onkeydown = e => { if (e.key === 'Enter') ok(); };
    const i = $('#ed-in', el); i.focus(); i.select();
  });
}
function lockedFrom(from) { return Object.keys(S.months).filter(ym => S.months[ym].locked && ym >= C.ymOf(from)).sort(); }
function savePrice(a, price) {
  price = Math.round(price);
  const cur = C.rateFor(a, today);
  if (price === cur) return;
  const recs = acadHasRecords(a.id), lockedRecs = acadHasRecords(a.id, true);
  if ((!recs || cur === 0) && !lockedRecs) {
    // 기록이 없거나 단가가 비어 있던 학원: 처음부터 이 단가로 계산
    a.rates = [{ from: BASE_FROM, price }]; markDirty('config'); renderAll(); toast(`${a.name} 회당 ${C.won(price)}원으로 저장했습니다.`); return;
  }
  openSheet(`<h3>${esc(a.name)} 단가 변경</h3><p class="muted" style="margin:0">${C.won(cur)}원 → <b>${C.won(price)}원</b></p>
    <label class="field"><span>적용 시작일</span><input type="date" id="r-d" value="${today}"></label>
    <p class="hint" style="margin:0">이 날짜부터 새 단가로 계산합니다. 그 전 기록은 기존 단가 그대로예요.</p><div class="pin-msg" id="r-msg"></div>
    <div class="row"><button class="btn" type="button" id="r-no">취소</button><span class="spacer"></span><button class="btn primary" type="button" id="r-ok">저장</button></div>`, s => {
    $('#r-no', s).onclick = () => { closeSheet(); renderAll(); };
    $('#r-ok', s).onclick = () => {
      const d = $('#r-d', s).value;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { $('#r-msg', s).textContent = '날짜를 확인하세요.'; return; }
      const lk = lockedFrom(d);
      if (lk.length) { $('#r-msg', s).textContent = `정산 완료된 달(${lk.map(x => +x.slice(5) + '월').join(', ')})에 걸칩니다. 날짜를 바꾸거나 잠금을 먼저 푸세요.`; return; }
      a.rates = (a.rates || []).filter(r => r.from !== d); a.rates.push({ from: d, price });
      closeSheet(); markDirty('config'); renderAll(); toast(`${d}부터 ${C.won(price)}원으로 계산합니다.`);
    };
  });
}
function bindSettings(el) {
  const P = '설정을 바꾸려면 PIN이 필요합니다.';
  const cfgChange = fn => guard(P, () => { fn(); markDirty('config'); renderAll(); });
  const on = (sel, fn) => el.querySelectorAll(sel).forEach(b => b.onclick = () => fn(b));
  const addKid = () => { const v = $('#st-kid', el).value.trim(); if (!v) { toast('자녀 이름을 입력하세요.'); return; } guard(P, () => { S.cfg.children.push({ id: 'c' + uid8(), name: v.slice(0, 20), order: S.cfg.children.length + 1, color: nextColor() }); markDirty('config'); renderAll(); toast(`${v} 추가했습니다.`); }); };
  $('#st-kid-add', el).onclick = addKid; $('#st-kid', el).onkeydown = e => { if (e.key === 'Enter') addKid(); };
  $('#st-ac-add', el).onclick = () => {
    const n = $('#st-ac', el).value.trim(), p = $('#st-rate', el).value;
    if (!n) { toast('학원 이름을 입력하세요.'); return; }
    if (p !== '' && !(Number(p) >= 0)) { toast('단가는 숫자로 입력하세요.'); return; }
    guard(P, () => { S.cfg.academies.push({ id: 'a' + uid8(), name: n.slice(0, 30), order: S.cfg.academies.length + 1, rates: [{ from: BASE_FROM, price: Math.round(Number(p) || 0) }] }); markDirty('config'); renderAll(); toast(`${n} 추가했습니다.`); });
  };
  on('[data-kup]', b => cfgChange(() => move(S.cfg.children, b.dataset.kup, -1)));
  on('[data-kdn]', b => cfgChange(() => move(S.cfg.children, b.dataset.kdn, 1)));
  on('[data-aup]', b => cfgChange(() => move(S.cfg.academies, b.dataset.aup, -1)));
  on('[data-adn]', b => cfgChange(() => move(S.cfg.academies, b.dataset.adn, 1)));
  on('[data-kren]', b => guard(P, () => { const k = kidOf(b.dataset.kren); editSheet('자녀 이름 변경', '이름', k.name, v => { k.name = v.slice(0, 20); markDirty('config'); renderAll(); toast('이름을 바꿨습니다.'); }); }));
  on('[data-aren]', b => guard(P, () => { const a = acadOf(b.dataset.aren); editSheet('학원 이름 변경', '이름', a.name, v => { a.name = v.slice(0, 30); markDirty('config'); renderAll(); toast('이름을 바꿨습니다.'); }); }));
  on('[data-kdel]', b => guard(P, () => { const k = kidOf(b.dataset.kdel); confirmSheet(`${k.name} 삭제`, '선택 버튼에서 뺍니다. 지난 기록과 정산 금액은 그대로 남아요.', '삭제', () => { k.archived = true; S.selKids.delete(k.id); markDirty('config'); renderAll(); }, true); }));
  on('[data-adel]', b => guard(P, () => { const a = acadOf(b.dataset.adel); confirmSheet(`${a.name} 삭제`, '선택 버튼에서 뺍니다. 지난 기록과 정산 금액은 그대로 남아요.', '삭제', () => { a.archived = true; S.selAcads.delete(a.id); markDirty('config'); renderAll(); }, true); }));
  el.querySelectorAll('[data-price]').forEach(inp => {
    const a = acadOf(inp.dataset.price); const btn = el.querySelector(`[data-psave="${a.id}"]`);
    const changed = () => inp.value !== '' && Math.round(Number(inp.value)) !== C.rateFor(a, today);
    inp.oninput = () => { btn.hidden = !changed(); };
    const commit = () => { if (!changed()) return; const v = Number(inp.value); if (!(v >= 0)) { toast('단가는 숫자로 입력하세요.'); return; } guard('단가를 바꾸려면 PIN이 필요합니다.', () => savePrice(a, v)); };
    btn.onclick = commit; inp.onkeydown = e => { if (e.key === 'Enter') { inp.blur(); commit(); } };
  });
  const ps = $('#pin-set', el); if (ps) ps.onclick = () => setPinFlow();
  const pc = $('#pin-change', el); if (pc) pc.onclick = () => guard('PIN을 바꾸려면 현재 PIN이 필요합니다.', () => setPinFlow());
  const pt = $('#pin-toggle', el); if (pt) pt.onclick = () => {
    if (pinOn()) guard('잠금을 끄려면 PIN이 필요합니다.', () => { S.cfg.sec.enabled = false; markDirty('config'); renderAll(); toast('PIN 잠금을 껐습니다.'); });
    else { S.cfg.sec.enabled = true; markDirty('config'); renderAll(); toast('PIN 잠금을 켰습니다.'); }
  };
  $('#st-backup', el).onclick = doBackup;
  $('#st-restore', el).onclick = () => guard('복원하려면 PIN이 필요합니다.', () => $('#restore-file').click());
  $('#diag-run', el).onclick = runDiag;
}

/* ---------- 자가 진단 ---------- */
async function runDiag() {
  const out = $('#diag-out'); out.innerHTML = '점검 중…'; const R = [];
  const add = (st, name, detail) => R.push({ st, name, detail });
  if (WEB) add(!IOS || STANDALONE ? 'ok' : 'warn', '실행 환경', STANDALONE ? '홈 화면 앱으로 실행 중' : IOS ? '사파리에서 실행 중 · 홈 화면에 추가하세요' : '브라우저에서 실행 중');
  else add(window.claude ? 'ok' : 'warn', '실행 환경', window.claude ? 'claude.ai 화면에서 실행 중' : 'claude.ai 밖에서 실행 중 (계정 저장 불가)');
  if (S.mode === 'db') {
    try {
      const ref = S.col.doc('probe'); const stamp = Date.now();
      await ref.set({ t: stamp }); const g = await ref.get(); await ref.delete();
      add(g.exists && g.data().t === stamp ? 'ok' : 'bad', '계정 저장소 쓰기·읽기', g.exists ? '정상 (테스트 기록 저장 후 삭제)' : '저장 후 다시 읽지 못함');
    } catch (e) { add('bad', '계정 저장소 쓰기·읽기', `<code>${esc(e.code || '')} ${esc(e.message || e)}</code>`); }
  } else if (!WEB) add('warn', '저장 위치', `이 브라우저 임시 저장 · ${esc(S.modeReason)}`);
  let lsOk = false; try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); lsOk = true; } catch (e) { }
  if (WEB) {
    let back = false; try { const d = loadLocal(); back = !!(d && d.cfg); } catch (e) { }
    add(lsOk && back ? 'ok' : 'bad', '기기 저장 쓰기·읽기', lsOk && back ? '정상' : '이 브라우저가 저장을 막고 있습니다 (개인정보 보호 모드인지 확인하세요)');
    add(S.persisted ? 'ok' : 'warn', '기록 보존', S.persisted ? '영구 보관 허용됨' : STANDALONE ? '홈 화면 앱: 정상 보관' : '홈 화면에 추가하면 더 안전하게 보관됩니다');
    add(navigator.serviceWorker && navigator.serviceWorker.controller ? 'ok' : 'warn', '오프라인 실행', navigator.serviceWorker && navigator.serviceWorker.controller ? '인터넷 없이도 열림' : '첫 실행 후 다시 열면 준비됩니다');
    const canShareFile = (() => { try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 'x.csv', { type: 'text/csv' })] })); } catch (e) { return false; } })();
    add('ok', '파일 저장(백업·CSV)', canShareFile ? '공유 창 → 파일에 저장' : '내려받기로 저장');
  } else {
    add(lsOk ? 'ok' : 'warn', '이 기기 보조 사본', lsOk ? '계정 저장 실패 시 이 기기에 사본 보관 가능' : '브라우저 저장이 막혀 있음 (계정 저장만 사용)');
    add(S.downloads ? 'ok' : 'warn', '파일 저장(백업·CSV)', S.downloads ? '사용 가능' : '이 화면에서 허용되지 않음 · 화면 상단 권한 메뉴를 확인하세요');
  }
  add(hasCrypto() ? 'ok' : 'warn', 'PIN 암호화', hasCrypto() ? 'PBKDF2-SHA256 해시 저장' : '사용 불가 · PIN 없이 기록은 계속 가능');
  add(navigator.onLine ? 'ok' : 'warn', '인터넷 연결', navigator.onLine ? '연결됨' : '끊김 · 연결되면 자동으로 저장됩니다');
  const zero = activeAcads().filter(a => !C.rateFor(a, today)).map(a => a.name);
  add(zero.length ? 'warn' : 'ok', '학원 단가', zero.length ? `미설정: ${esc(zero.join(', '))}` : '모든 학원 설정됨');
  const days = S.cfg.lastBackup ? Math.floor((Date.now() - Date.parse(S.cfg.lastBackup)) / 86400000) : null;
  add(days !== null && days < BACKUP_DAYS ? 'ok' : 'warn', '백업', days === null ? '백업 파일 없음' : `${days}일 전`);
  const nDocs = Object.keys(S.months).length + 1; const size = JSON.stringify({ c: S.cfg, m: S.months }).length;
  add('ok', '데이터 규모', `${nDocs}개 문서 · 약 ${Math.ceil(size / 1024)}KB (월별 1문서, 한도 25,000문서)`);
  if (S.lastError) add('bad', '최근 오류', `<code>${esc(S.lastError.where)} · ${esc(S.lastError.code)} · ${esc(S.lastError.message)} · ${esc(S.lastError.at)}</code>`);
  out.innerHTML = `<ul>${R.map(r => `<li><span class="st ${r.st}">${r.st === 'ok' ? '정상' : r.st === 'warn' ? '주의' : '오류'}</span><span><b>${esc(r.name)}</b><br>${r.detail}</span></li>`).join('')}</ul>`;
}

/* ---------- 라우팅 ---------- */
function renderChip() {
  const c = $('#store-chip');
  if (S.mode === 'db') { c.className = S.lastError ? 'chip warn' : 'chip ok'; c.innerHTML = `<span class="dot"></span>${S.lastError ? '저장 확인 필요' : '계정 저장'}`; }
  else if (S.mode === 'local' && WEB) { c.className = 'chip ok'; c.innerHTML = '<span class="dot"></span>기기 저장'; }
  else if (S.mode === 'local') { c.className = 'chip warn'; c.innerHTML = '<span class="dot"></span>임시 저장'; }
  else { c.className = 'chip mute'; c.innerHTML = '<span class="dot"></span>불러오는 중'; }
}
function render() {
  ['today', 'cal', 'settle', 'settings'].forEach(v => { $('#view-' + v).hidden = v !== S.view; });
  document.querySelectorAll('.tabs button').forEach(b => { if (b.dataset.tab === S.view) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (S.view === 'today') renderToday(); else if (S.view === 'cal') renderCal(); else if (S.view === 'settle') renderSettle(); else renderSettings();
  renderChip();
}
function renderAll() {
  if ($('#modal-root').innerHTML) { renderChip(); return; } // 입력 중인 시트는 유지
  if (S.view === 'settings' && document.activeElement && document.activeElement.matches('#view-settings input')) { renderChip(); return; }
  render();
}
function go(v) { S.view = v; render(); window.scrollTo(0, 0); }
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => go(b.dataset.tab));
// 아이폰은 앱 전환·화면 잠금 시 beforeunload가 오지 않으므로 숨김/종료 시점에 즉시 저장
const flushNow = () => { if (S.pendingMemo) S.pendingMemo(); if (dirty.size) { clearTimeout(flushTimer); flush(); } };
window.addEventListener('beforeunload', flushNow);
window.addEventListener('pagehide', flushNow);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushNow(); });
// 아이폰 키보드가 올라오면 하단 메뉴가 입력칸을 가리지 않도록 숨김
const isField = el => el && el.matches && el.matches('input:not([type=file]):not([type=checkbox]),textarea');
document.addEventListener('focusin', e => { if (isField(e.target)) document.body.classList.add('kb'); });
document.addEventListener('focusout', () => setTimeout(() => { if (!isField(document.activeElement)) document.body.classList.remove('kb'); }, 60));

render();
initStore();
})();

</script>

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { scope: './' }).catch(() => {}));
}
</script>
